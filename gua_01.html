function showGua(){
  const sel = document.getElementById("guaSelect").value;
  const yBox = document.getElementById("yaoDisplay");
  const rBox = document.getElementById("result");
  if(!sel){
    yBox.innerHTML = "";
    rBox.innerHTML = "";
    return;
  }
  const g = guaDict[sel];
  yBox.innerText = g.yao;
  rBox.innerHTML = `
    <div style="font-size:18px;font-weight:bold;color:#633b22;margin-bottom:8px">${g.name}</div>
    <div>${g.desc}</div>
    <div class="item-title">${g.self}</div>
    <div class="item-title">${g.work}</div>
    <div class="item-title">${g.money}</div>
    <div class="item-title">${g.love}</div>
  `
}
